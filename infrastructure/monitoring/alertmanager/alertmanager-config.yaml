apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: platform-webhook
      group_by: [alertname, application]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: platform-webhook
        webhook_configs:
          # Replace with the actual notification endpoint (Slack/PagerDuty/webhook).
          - url: http://placeholder-webhook:8080/hook
            send_resolved: true
