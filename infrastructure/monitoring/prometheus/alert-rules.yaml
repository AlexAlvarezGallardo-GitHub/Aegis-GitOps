apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
data:
  alert-rules.yml: |
    groups:
      - name: aegis-alerts
        rules:
          - alert: HighErrorRate
            expr: |
              sum by (application) (
                rate(http_server_requests_seconds_count{status=~"5.."}[5m])
              ) / clamp_min(
                sum by (application) (
                  rate(http_server_requests_seconds_count[5m])
                ), 0.001
              ) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Error rate above 5% ({{ $value | humanizePercentage }} on {{ $labels.application }})"
          - alert: HighLatencyP99
            expr: |
              histogram_quantile(0.99, sum by (le, application) (rate(http_server_requests_seconds_bucket[5m]))) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "P99 latency above 2s ({{ $value }}s on {{ $labels.application }})"
          - alert: PodRestarting
            expr: |
              increase(kube_pod_container_status_restarts_total[1h]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} restarted more than 3 times in the last hour"
          - alert: DiskUsageHigh
            expr: |
              100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Disk usage above 80% on {{ $labels.instance }} ({{ $labels.mountpoint }})"
