apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.logging.svc:3100
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          tracesToLogs:
            datasourceUid: loki
            tags:
              - trace_id
            mappedTags:
              - key: service.name
                value: service
            mapTagNamesEnabled: true
            query: '{service_name="${__tags.service}"} | trace_id="${__tags.trace_id}"'
            spanStartTimeShift: -1h
            spanEndTimeShift: 1h
