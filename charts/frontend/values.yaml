replicaCount: 1

image:
  repository: ghcr.io/alexalvarezgallardo-github/frontend
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

probe:
  path: /

config:
  PROXY_API_URL: "http://bff-service"

nginx:
  upstream: bff-dev
  port: 8082

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: frontend.aegis.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
