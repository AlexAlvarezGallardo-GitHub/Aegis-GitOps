replicaCount: 1

image:
  repository: ghcr.io/alexalvarezgallardo-github/wallet-service
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

probe:
  path: /actuator/health

config:
  SPRING_PROFILES_ACTIVE: "dev"

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: wallet.aegis.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
