replicaCount: 2

config:
  SPRING_PROFILES_ACTIVE: "stage"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: False
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: True
  minAvailable: 1

affinity: {}