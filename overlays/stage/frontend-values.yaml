replicaCount: 2
imagePullSecrets:
  - name: ghcr-pull

config:
  PROXY_API_URL: "http://bff-service"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: False
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: True
  minAvailable: 1

affinity: {}
nginx:
  upstream: bff-stage
  port: 8082