replicaCount: 1
image:
  repository: ghcr.io/alexalvarezgallardo-github/identity-service
  tag: 33632a75899f61829679f52ca830b2c5613d45a8
imagePullSecrets:
  - name: ghcr-pull

config:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-identity:5432/aegis_identity"
  SPRING_DATASOURCE_USERNAME: "aegis"
  SPRING_DATASOURCE_PASSWORD: "aegis_secret"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 250m
    memory: 384Mi

autoscaling:
  enabled: False
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: False
  minAvailable: 1

affinity: {}