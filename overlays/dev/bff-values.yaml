replicaCount: 1
image:
  repository: ghcr.io/alexalvarezgallardo-github/bff-service
  tag: d097c0d6c04b11f78ca8c3e85c1b4d9b2d3912d8
imagePullSecrets:
  - name: ghcr-pull

config:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_SESSION_STORE_TYPE: "redis"
  AEGIS_IDENTITY_SERVICE_URL: "http://identity-dev:8081"
  AEGIS_WALLET_SERVICE_URL: "http://wallet-dev:8083"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 250m
    memory: 384Mi

autoscaling:
  enabled: False
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: False
  minAvailable: 1

affinity: {}
