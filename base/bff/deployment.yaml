apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  labels:
    app: bff-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
    spec:
      containers:
        - name: bff-service
          image: ghcr.io/alexalvarezgallardo-github/bff-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: bff-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082