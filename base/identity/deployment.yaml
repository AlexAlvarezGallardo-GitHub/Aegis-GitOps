apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: ghcr.io/alexalvarezgallardo-github/identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: identity-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081